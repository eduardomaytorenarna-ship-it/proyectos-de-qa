name: CI E2E

on:
  push:
    paths:
      - 'automatizacion-e2e/**'
      - '.github/workflows/ci-e2e.yml'
  pull_request:
    paths:
      - 'automatizacion-e2e/**'
      - '.github/workflows/ci-e2e.yml'

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout de la suite de pruebas
        uses: actions/checkout@v4

      # La aplicacion bajo prueba vive en otro repositorio.
      - name: Checkout de la aplicacion
        uses: actions/checkout@v4
        with:
          repository: eduardo-mr1/proyectos-de-programacion
          path: app

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Levantar la API
        working-directory: app/api-gestor-tareas
        run: |
          npm install
          npm start &
          npx wait-on http://localhost:3000/health --timeout 60000

      - name: Construir y servir el frontend
        working-directory: app/frontend-gestor-tareas
        run: |
          npm install
          npm run build
          npx vite preview --port 5173 --host 127.0.0.1 &
          npx wait-on http://localhost:5173 --timeout 60000

      - name: Instalar Playwright
        working-directory: automatizacion-e2e
        run: |
          npm install
          npx playwright install --with-deps chromium

      - name: Correr las pruebas E2E
        working-directory: automatizacion-e2e
        run: npm test

      - name: Publicar evidencia si algo fallo
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: automatizacion-e2e/playwright-report/
          retention-days: 7
