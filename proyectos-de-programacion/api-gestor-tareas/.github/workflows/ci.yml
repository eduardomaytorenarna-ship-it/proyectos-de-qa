name: CI

on:
  push:
    paths:
      - 'proyectos-de-programacion/api-gestor-tareas/**'
  pull_request:
    paths:
      - 'proyectos-de-programacion/api-gestor-tareas/**'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: proyectos-de-programacion/api-gestor-tareas
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm test
